<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — Premium Collection By Sanjida</title>
<link rel="stylesheet" href="/styles.css">
<style>
.product-detail-page{padding:48px 0 80px;background:#f8f6f2;min-height:calc(100vh - 90px)}
.product-detail-shell{width:min(1180px,92%);margin:auto;background:#fff;border:1px solid #e7e0d6;border-radius:22px;overflow:hidden;box-shadow:0 18px 60px #1b2a3a12}
.detail-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:0}
.gallery{padding:26px;background:#f3f0eb;border-right:1px solid #e8e1d7}
.main-photo-wrap{position:relative;background:#fff;border-radius:16px;overflow:hidden;min-height:570px;display:grid;place-items:center}
.main-photo{width:100%;height:570px;object-fit:contain;display:block}
.gallery-count{position:absolute;left:16px;top:16px;background:#18283d;color:#fff;padding:7px 11px;border-radius:30px;font-size:11px;letter-spacing:1px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#fff;color:#18283d;border:1px solid #ddd5ca;font-size:20px;box-shadow:0 7px 20px #0001}.arrow.prev{left:14px}.arrow.next{right:14px}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.thumb{border:1px solid #ddd6cc;background:#fff;border-radius:9px;padding:0;overflow:hidden;cursor:pointer}.thumb.active{border:2px solid #a47c3e}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.detail-info{padding:52px 48px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#a47c3e}.detail-info h1{font:600 clamp(40px,5vw,64px)/.95 "Cormorant Garamond",serif;margin:12px 0}.detail-price{font:600 25px Inter,Arial,sans-serif;color:#18283d;margin:8px 0 22px}.detail-desc{font-size:14px;line-height:1.9;color:#70757b;white-space:pre-line}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.pill{font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#f2ede5;color:#71542d;padding:7px 10px;border-radius:30px}.checkout-btn{display:block;text-align:center;text-decoration:none;background:#18283d;color:#fff;padding:15px;border-radius:10px;font-weight:600;letter-spacing:.8px;margin-top:12px}.back-link{display:inline-block;margin-top:18px;color:#74787e;text-decoration:none;font-size:13px}.notice{margin-top:18px;padding:13px;border-radius:10px;background:#faf7f1;color:#777;font-size:12px;line-height:1.6}
@media(max-width:850px){.detail-grid{grid-template-columns:1fr}.gallery{border-right:0;border-bottom:1px solid #e8e1d7}.main-photo-wrap,.main-photo{min-height:420px;height:420px}.detail-info{padding:35px 25px}.thumbs{grid-template-columns:repeat(6,1fr)}}
@media(max-width:500px){.product-detail-page{padding:18px 0 45px}.gallery{padding:12px}.main-photo-wrap,.main-photo{min-height:330px;height:330px}.detail-info h1{font-size:43px}.thumbs{gap:5px}}
</style>
<style>
/* Responsive layer */
html,body{max-width:100%;overflow-x:hidden}
img,video{max-width:100%;height:auto}
*{box-sizing:border-box}
@media (max-width:768px){
  .container,.wrapper,.content,.section{width:100%!important;max-width:100%!important}
  .container,.wrapper,.content{padding-left:16px!important;padding-right:16px!important}
  .product-grid,.products,.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .hero{min-height:auto!important}
  nav{flex-wrap:wrap}
}
@media (max-width:520px){
  .product-grid,.products,.grid,.cards{grid-template-columns:1fr!important}
  h1{font-size:clamp(30px,10vw,46px)!important}
  h2{font-size:clamp(25px,8vw,36px)!important}
  button,.btn{min-height:44px}
  input,select,textarea{font-size:16px!important}
  table{display:block;overflow-x:auto}
}
</style>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
  <meta property="og:site_name" content="Premium Collection By Sanjida">
  <meta property="og:image" content="/assets/og-logo.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
<header class="site-header">
<a class="brand" href="/">PREMIUM COLLECTION <span>BY SANJIDA</span></a>
<nav><a href="/">Home</a><a href="/category.html?type=clothing">Clothing</a><a href="/category.html?type=cosmetics">Beauty</a><a class="cart-link" href="/cart.html">Bag <b id="cartCount">0</b></a></nav>
</header>
<main class="product-detail-page"><div id="loading" style="text-align:center;padding:80px;color:#777">Loading product...</div><div id="productShell" class="product-detail-shell" hidden></div></main>
<script>
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function getImages(p){const x=Array.isArray(p.images)?p.images.filter(Boolean):[];if(x.length)return x.slice(0,6);if(p.image)return [p.image];return []}
function updateCart(){try{const c=JSON.parse(localStorage.getItem('pcs_cart')||'[]');document.getElementById('cartCount').textContent=c.reduce((s,p)=>s+Number(p.qty||1),0)}catch{}}
const id=new URLSearchParams(location.search).get('id');let product=null,images=[],index=0;
function render(){
 const shell=document.getElementById('productShell');images=getImages(product);index=Math.min(index,Math.max(images.length-1,0));
 const img=images[index]||'/assets/clothing/2-piece.jpg';
 shell.innerHTML=`<div class="detail-grid"><section class="gallery"><div class="main-photo-wrap"><img id="mainPhoto" class="main-photo" src="${esc(img)}" alt="${esc(product.name)}"><span class="gallery-count">${images.length||1} ${images.length===1?'IMAGE':'IMAGES'}</span>${images.length>1?'<button class="arrow prev" onclick="change(-1)" aria-label="Previous image">‹</button><button class="arrow next" onclick="change(1)" aria-label="Next image">›</button>':''}</div>${images.length>1?'<div class="thumbs">'+images.map((x,i)=>`<button class="thumb ${i===index?'active':''}" onclick="setImage(${i})"><img src="${esc(x)}" alt="Image ${i+1}"></button>`).join('')+'</div>':''}</section><section class="detail-info"><div class="eyebrow">PREMIUM COLLECTION · ${esc((product.subcategory||product.group||'PRODUCT').toString())}</div><h1>${esc(product.name)}</h1><div class="detail-price">৳ ${Number(product.price||0).toLocaleString('en-BD')}.00</div><div class="meta"><span class="pill">Premium Quality</span><span class="pill">Cash On Delivery</span></div>${product.description?`<p class="detail-desc">${esc(product.description)}</p>`:'<p class="detail-desc">A carefully selected piece from Premium Collection By Sanjida.</p>'}<div class="notice">Review all product images and details before continuing. When you are ready, continue to checkout to enter your delivery information.</div><a class="checkout-btn" href="/checkout.html" onclick="prepareCheckout(event)">PROCEED TO CHECKOUT →</a><a class="back-link" href="javascript:history.back()">← Back to collection</a></section></div>`;
 shell.hidden=false;document.getElementById('loading').hidden=true;document.title=product.name+' — Premium Collection By Sanjida';updateCart();
}
function setImage(i){index=i;render()}
function change(n){index=(index+n+images.length)%images.length;render()}
function prepareCheckout(e){e.preventDefault();localStorage.setItem('pcs_cart',JSON.stringify([{id:product.id,name:product.name,price:Number(product.price||0),qty:1,image:images[0]||'',images,group:product.group,subcategory:product.subcategory,description:product.description||''}]));location.href='/checkout.html'}
(async()=>{try{const r=await fetch('/api/products');if(!r.ok)throw 0;const products=await r.json();product=products.find(p=>p.id===id);if(!product)throw 0;render()}catch{document.getElementById('loading').innerHTML='<h2>Product not found</h2><p>Please return to the collection and choose another product.</p><a href="/">Return to store</a>'}})();
</script>
</body>
</html>
