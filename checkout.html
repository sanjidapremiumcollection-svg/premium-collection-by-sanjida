<body>
  <div class="checkout-shell">
    <section class="checkout-main">
      <div class="checkout-inner">
        <a class="checkout-brand" href="/">PREMIUM COLLECTION <span>BY SANJIDA</span></a>

        <form id="checkoutForm" autocomplete="off" novalidate>
          <h2>Contact</h2>
          <input id="email" name="pcs_contact_email" type="email" placeholder="Email address (optional)" autocomplete="off">

          <h2>Delivery</h2>
          <div class="country" aria-label="Country or region">
            <span class="country-label">Country/Region</span>
            <strong>Bangladesh</strong>
            <span class="country-arrow">⌄</span>
          </div>

          <div class="two">
            <input id="firstName" name="pcs_customer_first" placeholder="First name" autocomplete="off">
            <input id="lastName" name="pcs_customer_last" placeholder="Last name" autocomplete="off">
          </div>
          <input id="address" name="pcs_customer_address" placeholder="Full delivery address" autocomplete="off">
          <div class="two">
            <input id="city" name="pcs_customer_city" placeholder="City / Area" autocomplete="off">
            <input id="postal" name="pcs_customer_postal" placeholder="Postal code (optional)" autocomplete="off">
          </div>
          <input id="phone" name="pcs_customer_phone" type="tel" placeholder="Phone number" autocomplete="off">

          <h3>Shipping method</h3>
          <div class="shipping">
            <label class="ship active"><input type="radio" name="ship" value="70" checked><span>Inside Dhaka</span><b>৳70.00</b></label>
            <label class="ship"><input type="radio" name="ship" value="110"><span>Suburb Dhaka</span><b>৳110.00</b></label>
            <label class="ship"><input type="radio" name="ship" value="130"><span>Outside Dhaka</span><b>৳130.00</b></label>
          </div>

          <h2>Payment</h2>
          <p class="secure">Your order will be confirmed with Cash on Delivery.</p>
          <div class="payment-selected"><span class="radio-dot"></span><b>Cash on Delivery (COD)</b></div>

          <button id="placeOrder" type="submit" class="place-order">PLACE ORDER</button>
          <div id="message" class="message" role="alert"></div>
        </form>
      </div>
    </section>

    <aside class="order-summary">
      <div class="summary-inner">
        <div class="summary-heading">YOUR ORDER</div>
        <div id="items"></div>
        <div class="line"><span>Subtotal · <span id="itemCount">0</span> items</span><b id="subtotal">৳0.00</b></div>
        <div class="line"><span>Shipping</span><b id="shipping">৳70.00</b></div>
        <div class="total"><span>Total</span><b>BDT <span id="total">৳0.00</span></b></div>
      </div>
    </aside>
  </div>

<script>
const params = new URLSearchParams(location.search);
const queryProduct = params.get("product");
const queryPrice = Number(params.get("price"));
if (queryProduct && Number.isFinite(queryPrice) && queryPrice > 0) {
  localStorage.setItem("pcs_cart", JSON.stringify([{name: queryProduct, price: queryPrice, qty: 1}]));
}
const cart = JSON.parse(localStorage.getItem("pcs_cart") || "[]");
const itemsEl = document.getElementById("items");
const subtotalEl = document.getElementById("subtotal");
const shippingEl = document.getElementById("shipping");
const totalEl = document.getElementById("total");
const countEl = document.getElementById("itemCount");
const ships = document.querySelectorAll('input[name="ship"]');
const form = document.getElementById("checkoutForm");

function money(n){
  return "৳" + Number(n).toLocaleString("en-BD", {minimumFractionDigits:2, maximumFractionDigits:2});
}

function render(){
  const items = cart.length ? cart : [{name:"Premium Collection Item", price:0, qty:1}];
  const subtotal = items.reduce((s,p)=>s + Number(p.price)*Number(p.qty||1),0);
  const ship = Number(document.querySelector('input[name="ship"]:checked').value);
  itemsEl.innerHTML = items.map(p => `
    <div class="item">
      <div class="item-img">${p.image ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}">` : `PREMIUM<br>COLLECTION`}</div>
      <div class="item-info"><b>${escapeHtml(p.name)}</b><span>Qty ${Number(p.qty||1)}</span></div>
      <strong>${money(Number(p.price)*Number(p.qty||1))}</strong>
    </div>`).join("");
  const count = items.reduce((s,p)=>s+Number(p.qty||1),0);
  countEl.textContent = count;
  subtotalEl.textContent = money(subtotal);
  shippingEl.textContent = money(ship);
  totalEl.textContent = money(subtotal+ship);
}

function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
}

// Prevent old browser autofill values from appearing before the customer chooses a field.
document.querySelectorAll("input[readonly]").forEach(input => {
  input.addEventListener("focus", () => input.removeAttribute("readonly"), {once:true});
});

ships.forEach(r => r.addEventListener("change", () => {
  document.querySelectorAll(".ship").forEach(x=>x.classList.remove("active"));
  r.closest(".ship").classList.add("active");
  render();
}));

render();

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const required = ["firstName","lastName","address","city","phone"];
  const missing = required.some(id => !document.getElementById(id).value.trim());
  const message = document.getElementById("message");

  if(missing){
    message.textContent = "Please enter your name, full address, city/area and phone number.";
    message.className = "message error";
    return;
  }

  const button = document.getElementById("placeOrder");
  button.disabled = true;
  button.textContent = "PROCESSING...";
  message.textContent = "";

  const shipping = Number(document.querySelector('input[name="ship"]:checked').value);
  const subtotal = cart.reduce((s,p)=>s + Number(p.price)*Number(p.qty||1),0);
  const customer = {
    email: document.getElementById("email").value.trim(),
    firstName: document.getElementById("firstName").value.trim(),
    lastName: document.getElementById("lastName").value.trim(),
    address: document.getElementById("address").value.trim(),
    city: document.getElementById("city").value.trim(),
    postal: document.getElementById("postal").value.trim(),
    phone: document.getElementById("phone").value.trim()
  };

  const payload = {
    customer,
    shipping,
    payment: "Cash on Delivery (COD)",
    items: cart,
    subtotal,
    total: subtotal + shipping
  };

  try {
    const res = await fetch("/api/orders", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.message || "Order could not be placed.");

    const order = {
      orderId: data.orderId,
      customer,
      shipping,
      payment: "Cash on Delivery (COD)",
      items: cart,
      subtotal,
      total: subtotal + shipping,
      placedAt: new Date().toISOString()
    };
    localStorage.setItem("pcs_last_order", JSON.stringify(order));
    localStorage.removeItem("pcs_cart");
    window.location.href = "/success.html";
  } catch (error) {
    button.disabled = false;
    button.textContent = "PLACE ORDER";
    message.textContent = error.message || "Something went wrong. Please try again.";
    message.className = "message error";
  }
});
</script>
