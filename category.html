<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection — Premium Collection By Sanjida</title>
  <link rel="stylesheet" href="/styles.css">
<style>
/* Responsive layer */
html,body{max-width:100%;overflow-x:hidden}
img,video{max-width:100%;height:auto}
*{box-sizing:border-box}
@media (max-width:768px){
  .container,.wrapper,.content,.section{width:100%!important;max-width:100%!important}
  .container,.wrapper,.content{padding-left:16px!important;padding-right:16px!important}
  .product-grid,.products,.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .hero{min-height:auto!important}
  nav{flex-wrap:wrap}
}
@media (max-width:520px){
  .product-grid,.products,.grid,.cards{grid-template-columns:1fr!important}
  h1{font-size:clamp(30px,10vw,46px)!important}
  h2{font-size:clamp(25px,8vw,36px)!important}
  button,.btn{min-height:44px}
  input,select,textarea{font-size:16px!important}
  table{display:block;overflow-x:auto}
}
</style>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
  <meta property="og:site_name" content="Premium Collection By Sanjida">
  <meta property="og:image" content="/assets/og-logo.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">PREMIUM COLLECTION <span>BY SANJIDA</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/category.html?type=clothing">Clothing</a>
      <a href="/category.html?type=cosmetics">Beauty</a>
      <a class="cart-link" href="/cart.html">Bag <b id="cartCount">0</b></a>
    </nav>
  </header>
  <main class="category-page">
    <section class="section category-page-head">
      <p class="eyebrow" id="categoryEyebrow">PREMIUM COLLECTION</p>
      <h1 id="categoryTitle">Collection</h1>
      <p id="categoryIntro">Explore our carefully selected collection.</p>
    </section>
    <section class="section category-options-section">
      <div class="category-options" id="categoryOptions"></div>
    </section>
  </main>
  <footer>
    <div class="copyright">© 2026 Premium Collection By Sanjida. All rights reserved.</div>
  </footer>
  <script>
    const data = {
      clothing: {
        eyebrow: "WOMEN'S CLOTHING",
        title: "Fashion Collection",
        intro: "Choose your collection and discover your next premium look.",
        items: [
          ["2 PIECE", "Elegant 2-piece sets", "#dfe8f2", "2-piece", "/assets/clothing/2-piece.jpg"],
          ["3 PIECE", "Premium 3-piece collections", "#d4e3f2", "3-piece", "/assets/clothing/3-piece.jpg"],
          ["4 PIECE", "Premium 4-piece collections", "#c7d9eb", "4-piece", "/assets/clothing/4-piece.jpg"]
        ]
      },
      cosmetics: {
        eyebrow: "WOMEN'S COSMETICS",
        title: "Beauty & Lifestyle",
        intro: "Explore beauty, accessories and lifestyle essentials.",
        items: [
          ["HAIR CARE", "Hair care essentials", "#f2d9df", "hair-care", "/assets/hair-care.jpg"],
          ["SKIN CARE", "Skin care essentials", "#ead1d8", "skin-care", "/assets/skin-care.jpg"],
          ["BABY PRODUCTS", "Gentle baby essentials", "#eadbe1", "baby-products", "/assets/baby-products.jpg"],
          ["JEWELLERY", "Elegant jewellery", "#e8dcc8", "jewellery", "/assets/jewellery.jpg"],
          ["BAGS", "Premium bags", "#dfd5d2", "bags", "/assets/bags.jpg"],
          ["ELECTRONIC GADGETS", "Useful lifestyle gadgets", "#d8dce4", "electronic-gadgets", "/assets/electronic-gadgets.jpg"]
        ]
      }
    };
    const type = new URLSearchParams(location.search).get('type') || 'clothing';
    const current = data[type] || data.clothing;
    document.title = `${current.title} — Premium Collection By Sanjida`;
    document.getElementById('categoryEyebrow').textContent = current.eyebrow;
    document.getElementById('categoryTitle').textContent = current.title;
    document.getElementById('categoryIntro').textContent = current.intro;
    document.getElementById('categoryOptions').innerHTML = current.items.map((item, i) => `
      <a class="inner-category-card ${item[4] ? "has-image" : ""}" href="/collection.html?category=${item[3]}" style="--card-tint:${item[2]};--card-image:url('${item[4]||''}')">
        <div class="inner-category-copy">
          <span class="inner-category-number">0${i+1}</span>
          <p>${current.eyebrow}</p><h2>${item[0]}</h2><span>${item[1]}</span>
          <strong>EXPLORE →</strong>
        </div>
        <div class="inner-category-image" aria-hidden="true"></div>
      </a>
    `).join('');
    const cart = (()=>{try{return JSON.parse(localStorage.getItem('pcs_cart')||'[]')}catch{return[]}})();
    document.getElementById('cartCount').textContent = cart.reduce((s,p)=>s+(p.qty||1),0);
  </script>
</body>
</html>
