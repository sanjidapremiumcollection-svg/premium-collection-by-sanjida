<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bag — Premium Collection By Sanjida</title><link rel="stylesheet" href="/styles.css"><style>
/* Responsive layer */
html,body{max-width:100%;overflow-x:hidden}
img,video{max-width:100%;height:auto}
*{box-sizing:border-box}
@media (max-width:768px){
  .container,.wrapper,.content,.section{width:100%!important;max-width:100%!important}
  .container,.wrapper,.content{padding-left:16px!important;padding-right:16px!important}
  .product-grid,.products,.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .hero{min-height:auto!important}
  nav{flex-wrap:wrap}
}
@media (max-width:520px){
  .product-grid,.products,.grid,.cards{grid-template-columns:1fr!important}
  h1{font-size:clamp(30px,10vw,46px)!important}
  h2{font-size:clamp(25px,8vw,36px)!important}
  button,.btn{min-height:44px}
  input,select,textarea{font-size:16px!important}
  table{display:block;overflow-x:auto}
}
</style></head>
<body>
<header class="site-header"><a class="brand" href="/">PREMIUM COLLECTION <span>BY SANJIDA</span></a><nav><a href="/">Continue Shopping</a></nav></header>
<main class="simple-page"><p class="eyebrow">YOUR BAG</p><h1>Shopping Bag</h1><div id="bag"></div><a class="btn" href="/checkout.html">CHECKOUT</a></main>
<script>
const bag = document.getElementById("bag");
const cart = JSON.parse(localStorage.getItem("pcs_cart") || "[]");
if (!cart.length) bag.innerHTML = "<p>Your bag is empty.</p>";
else bag.innerHTML = cart.map(p => `<div class="bag-row"><span>${p.name}</span><strong>৳ ${Number(p.price).toLocaleString("en-BD")}</strong></div>`).join("");
</script>
</body>
</html>
